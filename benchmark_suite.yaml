    telemetry_contract:
      required_validation_checks:
        - otel_spanmetrics_up
        - kube_state_metrics_up
        - cadvisor_up
        - cpu_series_present
        - memory_series_present
        - cpu_limit_series_present
        - memory_request_series_present
        - jaeger_services
      required_services:
        - frontend
        - checkoutservice
      fail_open: false
      notes: Requires both resource metrics and trace visibility to be benchmark-valid.
    ground_truth:
      acceptable_root_causes:
        - checkoutservice resource exhaustion
        - checkoutservice cpu pressure
        - checkoutservice latency bottleneck
      acceptable_actions:
        - wait_and_monitor
        - patch_resources(checkoutservice, cpu)
        - patch_resources_then_scale(checkoutservice)
      required_evidence:
        - get_k8s_state(checkoutservice)
