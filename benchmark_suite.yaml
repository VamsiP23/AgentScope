version: 2
name: AgentScope Distributed Systems Benchmark
goal: >
  Evaluate extensible agents on reproducible distributed-systems troubleshooting tasks
  using structured observability evidence, explicit telemetry contracts, and replayable
  task artifacts collected from live incidents.

comparison_targets:
  - id: react_reference
    description: Reference ReAct troubleshooting agent over the benchmark tool interface
    status: active
  - id: replay_reference
    description: Same reference agent evaluated against replay datasets instead of live infrastructure
    status: active
  - id: custom_agent
    description: User-implemented benchmark agent conforming to the shared runner interface
    status: planned

benchmark_policy:
  inclusion_rule: >
    A task is benchmark-ready only if detector behavior is stable and the task's telemetry contract
    passes without manual debugging. Candidate tasks may be kept for collection and replay curation.
  statuses:
    ready: Include in official benchmark tables and comparison runs.
    candidate: Keep for calibration, replay collection, and simulator validation.
    stretch: Optional harder task that does not block the core benchmark.

scorecard:
  metrics:
    - incident_detected
    - diagnosis_correct
    - action_correct
    - tool_calls_to_solution
    - time_to_diagnosis_seconds
    - invalid_submit_count
    - repeated_call_count
    - evidence_coverage
  output_files:
    - agent_report.json
    - aci_run_log.jsonl
    - detector_runs/latest_detection.json
    - evaluation.json

experiments:
  - id: rollout_failure_productcatalogservice
    status: ready
    category: availability_control
    task_family: rollout_failure
    scenario: invalid image tag prevents pods from becoming available
    entry_service: frontend
    experiment_file: experiments/bad_rollout_productcatalogservice_react.yaml
    target_service: productcatalogservice
    detector_gate:
      require_incident_detected: true
      target_deployment: productcatalogservice
      primary_signal: deployment_availability
    telemetry_contract:
      required_validation_checks:
        - otel_spanmetrics_up
        - kube_state_metrics_up
      required_services:
        - frontend
        - productcatalogservice
      fail_open: true
      notes: Availability-control tasks do not require Jaeger or cAdvisor to be benchmark-valid.
    ground_truth:
      acceptable_root_causes:
        - productcatalogservice bad rollout
        - rollout failure on productcatalogservice
      acceptable_actions:
        - kubectl rollout undo deployment/productcatalogservice
      required_evidence:
        - get_k8s_state(productcatalogservice)
        - get_logs(productcatalogservice)
      traces_required: false
    notes: Stable control task for deployment unavailability and targeted rollback reasoning.

