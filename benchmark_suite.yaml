version: 1
name: AgentScope Kubernetes Incident Triage Benchmark
goal: >
  Evaluate LLM incident-triage agents on reproducible Kubernetes faults using a
  structured tool interface, detector-gated experiment runs, and fixed grading criteria.

comparison_targets:
  - id: pure_react
    description: ReAct agent with typed-tool search guardrails and model-driven stopping
    status: active

benchmark_policy:
  inclusion_rule: >
    An experiment is benchmark-ready only after it triggers the detector 3/3 times
    and produces stable observability artifacts without manual intervention.
  statuses:
    ready: Include in official benchmark runs and result tables.
    candidate: Keep in calibration until detector reliability and agent traces are stable.
    stretch: Optional experiment for deeper evaluation; do not block the core benchmark.

scorecard:
  metrics:
    - incident_detected
    - diagnosis_correct
    - action_correct
    - tool_calls_to_solution
    - time_to_diagnosis_seconds
    - invalid_submit_count
    - repeated_call_count
    - evidence_coverage
  output_files:
    - agent_report.json
    - aci_run_log.jsonl
    - detector_runs/latest_detection.json

experiments:
  - id: bad_rollout_productcatalogservice
    status: ready
    category: availability_control
    experiment_file: /Users/aarnavsawant/Documents/CS6365/AgentScope/experiments/bad_rollout_productcatalogservice_react.yaml
    target_service: productcatalogservice
    detector_gate:
      require_incident_detected: true
      target_deployment: productcatalogservice
      primary_signal: deployment_availability
    ground_truth:
      acceptable_root_causes:
        - productcatalogservice bad rollout
      acceptable_actions:
        - kubectl rollout undo deployment/productcatalogservice
      required_evidence:
        - get_k8s_state(productcatalogservice)
        - get_logs(productcatalogservice)
      traces_required: false
    notes: Stable control case for unavailable deployment plus startup failure evidence.

  - id: bad_rollout_recommendationservice
