name: Native CPU Pressure Stress Job Baseline
namespace: default
startup:
  enabled: false
  args: []
timings:
  pre_fault_delay_seconds: 30
  post_fault_delay_seconds: 60
traffic:
  enabled: true
  base_url: http://localhost:8080
  duration_seconds: 300
  rps: 6
baseline:
  enabled: true
  duration_seconds: 300
  interval_seconds: 15
fault:
  kind: native_kubernetes
  duration_seconds: 90
  auto_revert: true
  spec:
    id: cpu-pressure-stress-job
    type: stress_job
    job_name: agentscope-cpu-pressure
    image: busybox:1.36
    command: ["sh", "-c"]
    args:
      - "for i in 1 2; do while true; do :; done & done; sleep 90"
    resources:
      requests:
        cpu: 500m
        memory: 32Mi
      limits:
        cpu: "1"
        memory: 128Mi
detector:
  enabled: true
  prom_url: http://localhost:9090
  target_deployment: frontend
  service_latency_threshold_ms: 1000
  interval_seconds: 10
agent:
  enabled: false
  mode: llm
  dry_run: true
  max_iterations: 2
  verify_wait_seconds: 30
  jaeger_url: http://localhost:16686
  target_deployment: frontend
  require_incident_detected: true
  wait_for_incident_timeout_seconds: 90
  wait_for_incident_poll_seconds: 5
