name: Bad Rollout Recommendationservice React
namespace: default
startup:
  enabled: false
  args: []
timings:
  pre_fault_delay_seconds: 30
  post_fault_delay_seconds: 60
traffic:
  enabled: true
  base_url: http://localhost:8080
  duration_seconds: 300
  rps: 1
baseline:
  enabled: true
  duration_seconds: 300
  interval_seconds: 15
reset:
  enabled: true
  before_run: true
  after_run: true
  on_error: true
  context: docker-desktop
fault:
  apply_cmd:
    - env
    - NAMESPACE=default
    - DEPLOYMENT=recommendationservice
    - CONTAINER=server
    - FORCE_RECREATE=true
    - APPLY_WAIT_TIMEOUT_SECONDS=5
    - GOOD_IMAGE=us-central1-docker.pkg.dev/google-samples/microservices-demo/recommendationservice:v0.10.4
    - BAD_IMAGE=us-central1-docker.pkg.dev/google-samples/microservices-demo/recommendationservice:not-a-real-tag
    - ./scripts/bad_rollout_fault.sh
    - apply
  revert_cmd:
    - env
    - NAMESPACE=default
    - DEPLOYMENT=recommendationservice
    - CONTAINER=server
    - FORCE_RECREATE=true
    - GOOD_IMAGE=us-central1-docker.pkg.dev/google-samples/microservices-demo/recommendationservice:v0.10.4
    - ./scripts/bad_rollout_fault.sh
    - revert
  duration_seconds: 120
  auto_revert: false
detector:
  enabled: true
  prom_url: http://localhost:9090
  target_deployment: recommendationservice
  interval_seconds: 10
agent:
  enabled: true
  type: react
  dry_run: true
  jaeger_enabled: true
  max_steps: 12
  jaeger_url: http://localhost:16686
  target_deployment: recommendationservice
  problem_description: An incident has been detected in the Online Boutique cluster. Investigate using available tools and identify the root cause and appropriate remediation action.
  require_incident_detected: true
  wait_for_incident_timeout_seconds: 90
  wait_for_incident_poll_seconds: 5
