name: Native Scale Zero Recommendationservice Short
namespace: default
startup:
  enabled: false
  args: []
timings:
  pre_fault_delay_seconds: 10
  post_fault_delay_seconds: 60
traffic:
  enabled: true
  base_url: http://localhost:8080
  mode: product-heavy
  duration_seconds: 70
  rps: 4
baseline:
  enabled: false
  duration_seconds: 70
  interval_seconds: 10
fault:
  kind: native_kubernetes
  duration_seconds: 30
  auto_revert: true
  spec:
    id: scale-zero-recommendationservice-short
    type: deployment_scale
    deployment: recommendationservice
    replicas: 0
detector:
  enabled: true
  prom_url: http://localhost:9090
  target_deployment: recommendationservice
  interval_seconds: 5
agent:
  enabled: false
  mode: llm
  dry_run: true
  max_iterations: 2
  verify_wait_seconds: 10
  jaeger_url: http://localhost:16686
  target_deployment: recommendationservice
  require_incident_detected: true
  wait_for_incident_timeout_seconds: 30
  wait_for_incident_poll_seconds: 5
