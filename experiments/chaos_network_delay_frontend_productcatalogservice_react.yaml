name: Chaos Network Delay Frontend Productcatalogservice React
namespace: default
startup:
  enabled: false
  args: []
timings:
  pre_fault_delay_seconds: 30
  post_fault_delay_seconds: 60
traffic:
  enabled: true
  base_url: http://localhost:8080
  duration_seconds: 300
  rps: 10
baseline:
  enabled: true
  duration_seconds: 300
  interval_seconds: 15
reset:
  enabled: true
  before_run: true
  after_run: true
  on_error: true
  context: docker-desktop
fault:
  filepath: chaosmesh/experiments/networkchaos-delay-frontend-productcatalogservice.yaml
  duration_seconds: 120
  auto_revert: false
detector:
  enabled: true
  prom_url: http://localhost:9090
  target_deployment: frontend
  service_latency_threshold_ms: 800
  interval_seconds: 10
agent:
  enabled: true
  type: react
  dry_run: true
  jaeger_enabled: true
  max_steps: 14
  jaeger_url: http://localhost:16686
  target_deployment: frontend
  problem_description: An incident has been detected in the Online Boutique cluster. Investigate the user-facing latency issue, identify the true bottleneck, and recommend the appropriate remediation action.
  require_incident_detected: true
  wait_for_incident_timeout_seconds: 90
  wait_for_incident_poll_seconds: 5
