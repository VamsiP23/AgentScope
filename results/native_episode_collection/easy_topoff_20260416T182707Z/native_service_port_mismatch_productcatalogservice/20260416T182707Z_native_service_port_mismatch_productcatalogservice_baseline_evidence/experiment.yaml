name: Native Service Port Mismatch Productcatalogservice Baseline
namespace: default
startup:
  enabled: false
  args: []
timings:
  pre_fault_delay_seconds: 30
  post_fault_delay_seconds: 60
traffic:
  enabled: true
  base_url: http://localhost:8080
  mode: product-heavy
  duration_seconds: 300
  rps: 4
baseline:
  enabled: true
  duration_seconds: 300
  interval_seconds: 15
fault:
  kind: native_kubernetes
  duration_seconds: 120
  auto_revert: true
  spec:
    id: port-mismatch-productcatalogservice
    type: service_ports
    service: productcatalogservice
    port_index: 0
    target_port: 1
detector:
  enabled: true
  prom_url: http://localhost:9090
  target_deployment: productcatalogservice
  interval_seconds: 10
agent:
  enabled: false
  mode: llm
  dry_run: true
  max_iterations: 2
  verify_wait_seconds: 30
  jaeger_url: http://localhost:16686
  target_deployment: productcatalogservice
  require_incident_detected: true
  wait_for_incident_timeout_seconds: 90
  wait_for_incident_poll_seconds: 5
