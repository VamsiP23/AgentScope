name: Native Pod Delete Cartservice Baseline
namespace: default
startup:
  enabled: false
  args: []
timings:
  pre_fault_delay_seconds: 30
  post_fault_delay_seconds: 90
traffic:
  enabled: true
  base_url: http://localhost:8080
  duration_seconds: 300
  rps: 3
baseline:
  enabled: true
  duration_seconds: 300
  interval_seconds: 15
fault:
  kind: native_kubernetes
  duration_seconds: 60
  auto_revert: true
  spec:
    id: pod-delete-cartservice
    type: pod_delete
    selector: app=cartservice
    limit: 1
detector:
  enabled: true
  prom_url: http://localhost:9090
  target_deployment: cartservice
  interval_seconds: 10
agent:
  enabled: false
  mode: llm
  dry_run: true
  max_iterations: 2
  verify_wait_seconds: 30
  jaeger_url: http://localhost:16686
  target_deployment: cartservice
  require_incident_detected: false
  wait_for_incident_timeout_seconds: 90
  wait_for_incident_poll_seconds: 5
