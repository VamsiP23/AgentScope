name: Native CPU Limit Throttle Checkoutservice Baseline
namespace: default
startup:
  enabled: false
  args: []
timings:
  pre_fault_delay_seconds: 30
  post_fault_delay_seconds: 60
traffic:
  enabled: true
  base_url: http://localhost:8080
  mode: checkout-heavy
  duration_seconds: 300
  rps: 8
baseline:
  enabled: true
  duration_seconds: 300
  interval_seconds: 15
fault:
  kind: native_kubernetes
  duration_seconds: 120
  auto_revert: true
  spec:
    id: cpu-limit-throttle-checkoutservice
    type: deployment_resources
    deployment: checkoutservice
    container: server
    resources:
      requests:
        cpu: 5m
        memory: 64Mi
      limits:
        cpu: 20m
        memory: 256Mi
detector:
  enabled: true
  prom_url: http://localhost:9090
  target_deployment: checkoutservice
  service_latency_threshold_ms: 750
  interval_seconds: 10
agent:
  enabled: false
  mode: llm
  dry_run: true
  max_iterations: 2
  verify_wait_seconds: 30
  jaeger_url: http://localhost:16686
  target_deployment: checkoutservice
  require_incident_detected: true
  wait_for_incident_timeout_seconds: 90
  wait_for_incident_poll_seconds: 5
